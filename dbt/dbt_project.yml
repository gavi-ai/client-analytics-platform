name: 'client_analytics'
version: '1.0.0'
config-version: 2

profile: 'client_analytics'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  client_analytics:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["marts"]
      finance:
        +materialized: incremental
        +unique_key: payment_id

vars:
  # Used in incremental models to limit backfill scope
  start_date: '2025-01-01'
